services:
  postgres:
    image: postgres:17.5
    container_name: e-learning-db
    environment:
      POSTGRES_DB: ${DB_NAME:-elearning-db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgres/data/data
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/data
    networks:
      - e-learning-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  e-learning-network:
    driver: bridge